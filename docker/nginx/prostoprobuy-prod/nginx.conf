user nginx;

worker_processes auto;

events {
    worker_connections 1024;

    multi_accept on;
    use epoll;
}

error_log /var/log/nginx/error.log crit;
pid       /var/run/nginx.pid;

http {
    include /etc/nginx/base-nginx.conf;

    # Заголовок Connection проксируем «как надо»: "upgrade" только для
    # WebSocket-запросов, для обычных — пустой, чтобы не ломать keep-alive.
    map $http_upgrade $proxy_connection_header {
        default upgrade;
        ''      '';
    }

    #################################
    #           BASE SERVER         #
    #################################

    server {
        listen 80;
        listen [::]:80;


        server_name prostoprobuy-prod.ru
                    api.prostoprobuy-prod.ru
                    admin.prostoprobuy-prod.ru
                    grafana.prostoprobuy-prod.ru;

        # location /.well-known/acme-challenge/ {
        #     root /var/www/certbot;
        # }

        if ($http_user_agent ~* LWP::Simple|BBBike|wget|msnbot|scrapbot) {
            return 403;
        }
        return 301 https://$host$request_uri;
    }

    #################################
    #           BACKEND             #
    #################################

    server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name db-admin.prostoprobuy-dev.ru;
    ssl_certificate /etc/letsencrypt/live/db-admin.prostoprobuy-prod.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/db-admin.prostoprobuy-prod.ru/privkey.pem;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://admin-db-dev:8080/;
    }
}

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.prostoprobuy-prod.ru;

        http2 on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        ssl_certificate /etc/letsencrypt/live/api.prostoprobuy-prod.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.prostoprobuy-prod.ru/privkey.pem;

        location /staticfiles/ {
            expires    7d;
            add_header Cache-Control "public, max-age=604800, must-revalidate";
            proxy_pass http://core-api:8000/staticfiles/;
        }

        location / {

            if ($http_origin = "") {
                return 403;
            }
            if ($http_origin !~* "(https://admin.prostoprobuy-prod.ru|https://prostoprobuy-prod.ru)") {
                return 403;
            }

            limit_req  zone=one burst=20 nodelay; # ограничивает частоту запросов (например, защита от DDoS).
            limit_conn addr 20; # ограничивает число одновременных соединений с одного IP-адреса

            proxy_set_header   Upgrade $http_upgrade; # для поддержки WebSocket (передаёт заголовок Upgrade).
            proxy_set_header   Connection "upgrade"; # используется совместно с Upgrade
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for; # передают путь IP клиента.
            proxy_set_header   X-Forwarded-Proto $scheme; # передает протокол.
            proxy_set_header   Host $http_host; # передает начальный IP клиента.
            proxy_set_header   X-Real-IP $remote_addr; # передает реальный IP клиента.
            proxy_cache_bypass $http_upgrade; #  отключает кэш для WebSocket-подключений.
            proxy_http_version 1.1; # используется для WebSocket и keep-alive соединений.
            proxy_redirect     off; # отключает автоматическую подстановку Location-заголовков от backend'а.
            proxy_pass         http://core-api:8000/; #  основной backend-сервер (API-приложение), куда идут все остальные запросы.
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }
    }

    #################################
    #           ADMIN               #
    #################################

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name admin.prostoprobuy-prod.ru;

        http2 on;

        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        ssl_certificate /etc/letsencrypt/live/admin.prostoprobuy-prod.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.prostoprobuy-prod.ru/privkey.pem;

        location /_next/static/ {
            proxy_pass http://admin-client:3001/_next/static/;
            expires    7d;
            add_header Cache-Control "public, max-age=604800, must-revalidate";
        }

        location / {
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
            proxy_pass         http://admin-client:3001/;
        }
    }

    #################################
    #           TMA                 #
    #################################

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name prostoprobuy-prod.ru;

        http2 on;

        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        ssl_certificate /etc/letsencrypt/live/prostoprobuy-prod.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/prostoprobuy-prod.ru/privkey.pem;

        location /_next/static/ {
            proxy_pass http://tma-client:3002/_next/static/;
            expires    7d;
            add_header Cache-Control "public, max-age=604800, must-revalidate";
        }

        location / {
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
            proxy_pass         http://tma-client:3002/;
        }

    }

    #########################################
    #   PROSTOPROBUY.PRO — российский прокси #
    #########################################
    # Приложение и база живут на Railway (зарубежный хостинг). У части
    # российских провайдеров до IP Railway нет маршрута: сайт не открывается
    # вообще, браузер пишет «prostoprobuy.pro прервал подключение». Поэтому
    # домен смотрит на этот российский сервер, а он проксирует запросы в
    # Railway — переносить базу для этого не нужно.
    #
    # API отдаём на том же домене под /api/: иначе браузер шёл бы на второй
    # (тоже недоступный) домен *.up.railway.app. Побочно уходит CORS —
    # запросы становятся same-origin.
    #
    # Railway маршрутизирует запросы по Host/SNI на общем edge, поэтому для
    # фронтенда подставляем Host и SNI prostoprobuy.pro, а соединение открываем
    # по известному имени сервиса. Свой домен здесь использовать нельзя: он
    # резолвится в этот же сервер и получилась бы петля.

    server {
        listen 80;
        listen [::]:80;
        server_name prostoprobuy.pro www.prostoprobuy.pro;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://prostoprobuy.pro$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.prostoprobuy.pro;

        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        ssl_certificate /etc/letsencrypt/live/prostoprobuy.pro/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/prostoprobuy.pro/privkey.pem;

        return 301 https://prostoprobuy.pro$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name prostoprobuy.pro;

        http2 on;

        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        ssl_certificate /etc/letsencrypt/live/prostoprobuy.pro/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/prostoprobuy.pro/privkey.pem;

        # Адрес edge Railway резолвим в рантайме: без resolver nginx запомнит
        # IP при старте и перестанет отдавать сайт, когда Railway его сменит.
        resolver 77.88.8.8 8.8.8.8 valid=60s ipv6=off;
        resolver_timeout 5s;

        # Через прокси идёт загрузка фото и видео анкет.
        client_max_body_size 2G;

        # В base-nginx.conf таймауты рассчитаны на локальный бэкенд (15s).
        # До Railway запрос идёт через интернет и может ждать холодный старт.
        proxy_connect_timeout 15s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $proxy_connection_header;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_ssl_server_name on;
        proxy_redirect off;

        location /api/ {
            set $api_origin "casting-platform-production.up.railway.app";
            proxy_set_header Host $api_origin;
            proxy_ssl_name        $api_origin;
            # Префикс срезаем через rewrite, а не через URI в proxy_pass: с
            # переменной в адресе nginx передаёт путь как есть, и бэкенд
            # получал бы /api/... — то есть 404 на каждом запросе.
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass https://$api_origin;
        }

        location / {
            set $web_origin "casting-platform-production.up.railway.app";
            proxy_set_header Host prostoprobuy.pro;
            proxy_ssl_name        prostoprobuy.pro;
            proxy_pass https://$web_origin;
        }
    }

    #################################
    #           GRAFANA             #
    #################################

     server {
         listen 443 ssl;
         listen [::]:443 ssl;
         server_name grafana.prostoprobuy-prod.ru;

         # if ($whitelist = 0) {
         #    return 403;
         # }

         ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
         ssl_certificate /etc/letsencrypt/live/grafana.prostoprobuy-prod.ru/fullchain.pem;
         ssl_certificate_key /etc/letsencrypt/live/grafana.prostoprobuy-prod.ru/privkey.pem;

         location / {
             proxy_set_header Host $http_host;
             proxy_set_header X-Forwarded-Proto $scheme;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_pass       http://grafana:3030/;
         }
     }

}